<script type="text/javascript">
    RED.nodes.registerType('zkteco-hello',{
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: {value:""}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-smile-o",
        label: function() {
            return this.name || "zkteco hello";
        }
    });
</script>

<script type="text/html" data-template-name="zkteco-hello">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
</script>

<script type="text/html" data-help-name="zkteco-hello">
    <p>A simple node that says Hello to ZKTeco without connecting to a device.</p>
    <p>This is meant for learning Node-RED node lifecycle.</p>
</script>
