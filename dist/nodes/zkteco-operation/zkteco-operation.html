<script type="text/javascript">
    RED.nodes.registerType('zkteco-operation', {
        category: 'function',
        color: '#a6bbcf',
        defaults: {
            name: { value: "" },
            config: { type: "zkteco-config", required: true },
            operation: { value: "getInfo", required: true }
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-cogs",
        label: function () {
            return this.name || "zkteco operation";
        }
    });
</script>

<script type="text/html" data-template-name="zkteco-operation">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-config"><i class="fa fa-server"></i> Device</label>
        <input type="text" id="node-input-config">
    </div>
    <div class="form-row">
        <label for="node-input-operation"><i class="fa fa-wrench"></i> Operation</label>
        <select id="node-input-operation">
            <option value="getInfo">Get Device Info</option>
            <option value="getUsers">Get Users</option>
            <option value="getAttendances">Get Attendance Logs</option>
        </select>
    </div>
</script>

<script type="text/html" data-help-name="zkteco-operation">
    <p>Executes an operation on a connected ZKTeco device.</p>
    
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Triggers the operation. Depending on the operation, the payload might carry parameters in the future.</dd>
    </dl>
    
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>The normalized result of the operation.</dd>
        
        <dt>operation <span class="property-type">string</span></dt>
        <dd>The name of the operation that was executed.</dd>
    </dl>
    
    <h3>Details</h3>
    <p>Make sure to run a <code>ZKTeco Connect</code> node before triggering this operation, otherwise the operation will fail.</p>
</script>
